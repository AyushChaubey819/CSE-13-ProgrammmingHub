<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="mainHeading">Welcome to JavaScript Lab</h1>

    <p id="paragraph">
        This is a sample paragraph. Use the buttons below to interact with the page.
    </p>

    <input
        type="text"
        id="userInput"
        placeholder="Enter new heading text"
    >

    <br><br>

    <button id="changeTextBtn">Change Heading</button>
    <button id="bgColorBtn">Change Background Color</button>
    <button id="fontSizeBtn">Increase Font Size</button>
    <button id="toggleBtn">Show / Hide Paragraph</button>
    <button id="resetBtn">Reset Page</button>

    <script src="script.js"></script>

</body>
</html>
